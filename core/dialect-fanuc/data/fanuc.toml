# Fanuc milling dialect: code table.
#
# Every G and M code this dialect recognises. `handler` names the Rust
# routine in src/lib.rs that carries the code out:
#
#   rapid, linear, arc_cw, arc_ccw   motion (group 1)
#   plane_*, units_*, absolute, incremental, work_offset, feed_per_minute
#                                    modal settings
#   no_effect      cancel/setting codes that cannot change the path here
#                  because what they cancel is never active (G40, G49, G80)
#   not_simulated  accepted, but the effect is not modelled yet: a warning is
#                  reported and the block still moves (G41-G44)
#   unsupported    recognised but not supported: an error is reported, and if
#                  the code could change motion the block does not move
#
# Codes not listed here are unknown: an error is reported and the block does
# not move. Group numbers follow the Fanuc G-code list (group 0 = one-shot).
# M codes other than M00/M01/M02/M30/M98/M99 are defined by the machine
# builder; the meanings below are the common convention.
# See docs/dialect-notes/fanuc.md.

[dialect]
id = "fanuc"
variant = "0i-M"

[[g]]
code = "G00"
group = 1
modal = true
handler = "rapid"
description = "Rapid positioning"

[[g]]
code = "G01"
group = 1
modal = true
handler = "linear"
description = "Linear interpolation"

