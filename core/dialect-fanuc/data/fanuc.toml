# Fanuc milling dialect: code table.
#
# Every G and M code this dialect recognises. `handler` names the Rust
# routine in src/lib.rs that carries the code out:
#
#   rapid, linear, arc_cw, arc_ccw   motion (group 1)
#   plane_*, units_*, absolute, incremental, work_offset, feed_per_minute
#                                    modal settings
#   no_effect      codes that cannot change the path here: cancels (G40, G49,
#                  G80, G15, G50, G50.1, G69), and modes that only affect
#                  feed, acceleration or cornering (G61-G64, G05.1...)
#   not_simulated  accepted, but the effect is not modelled yet: a warning is
#                  reported and the block still moves (G41, G42)
#   length_compensation  G43/G44: never simulated, one note per program
#   unsupported    recognised but not supported: an error is reported, and if
#                  the code could change motion the block does not move
#   ignored        changes how later blocks move but is not simulated
#                  (coordinate shifts and offset setting, rotation, scaling,
#                  mirroring, polar input, macro and subprogram calls): a
#                  warning, its words are data, and later moves are drawn
#                  without its effect. Moves are never hidden.
#   subprogram_call, subprogram_return
#                  M98 (P program, L or leading P digits repeat) and M99:
#                  the interpreter follows the call within the same file
#   canned_cycle   G73-G89 cycles, not simulated: each hole is drawn as a
#                  rapid to its position in the working plane
#   reference_return, reference_return_other, machine_rapid
#                  G28, G30 and G53; see src/block.rs
#
# Codes not listed here are unknown: an error is reported, the block does not
# move, and later moves are drawn as programmed. Group numbers follow the Fanuc G-code list (group 0 = one-shot).
# M codes other than M00/M01/M02/M30/M98/M99 are defined by the machine
# builder; the meanings below are the common convention.
# See docs/dialect-notes/fanuc.md.

[dialect]
id = "fanuc"
variant = "0i-M"

