[package]
name = "ir"
description = "Dialect- and machine-neutral IR: segments, diagnostics and render-buffer encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Serialize/Deserialize for every IR type (used by golden tests to write JSON).
serde = ["dep:serde"]

[dependencies]
thiserror = "2.0.17"
serde = { version = "1.0.219", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.9"
serde_json = "1.0.140"
