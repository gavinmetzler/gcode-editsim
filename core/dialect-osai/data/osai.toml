# Osai 10 Series dialect (milling): code table. A stub (M2) to exercise the
# dialect interfaces; see docs/dialect-notes/osai.md.
#
# Source for every entry: "10 Series CNC Programming Manual" (Osai), chapter
# 1 "G Codes" (G code summary, p. 1-11/1-12), chapter 2 and chapter 6
# "Miscellaneous Functions". Group numbers follow the manual's group letters
# (a = 1, b = 2, ..., m = 13); 0 = one-shot. The machine builder can change
# the default configuration (AMP).
#
# `handler` names the routine in src/block.rs:
#
#   rapid, linear, arc_cw, arc_ccw    motion (group a)
#   plane_12, plane_31, plane_23      G17/G18/G19: the plane of the 1st and
#                                     2nd, 3rd and 1st, 2nd and 3rd axes in
#                                     the machine's axis order (p. 2-47)
#   units_inch, units_metric, absolute, incremental, feed_per_minute
#   machine_coords G79: this block's coordinates refer to the home position
#   dwell          G04: dwell at the end of the block (time set by DWT)
#   no_effect      changes only feed, cornering or acceleration, or cancels
#                  something never active here
#   not_simulated  accepted with a warning; the path is shown without it
#   ignored        changes where later blocks move but is not simulated (axis
#                  presetting): a warning, its words are data, and later moves
#                  are drawn without its effect. Moves are never hidden.
#   canned_cycle   G81-G89, not simulated: each hole is drawn as a rapid to its
#                  position in the working plane
#
# G codes not listed are unknown: an error, the block does not move, and
# later moves are drawn as programmed. This includes G16 (plane by axis
# names), G20/G21 (GTL profiles), G33 (threading), G60-G67 (HSM profiles)
# and G72-G74 (probing).

[dialect]
id = "osai"
variant = "10 Series (mill)"

# ---- group a: motion (power-up G00) --------------------------------------

[[g]]
code = "G00"
group = 1
modal = true
handler = "rapid"
description = "Rapid axes positioning"

[[g]]
code = "G01"
group = 1
modal = true
handler = "linear"
description = "Linear interpolation"

[[g]]
code = "G02"
group = 1
modal = true
handler = "arc_cw"
description = "Circular interpolation CW"
words = { optional = ["I", "J", "R", "K"] }

[[g]]
code = "G03"
group = 1
modal = true
handler = "arc_ccw"
description = "Circular interpolation CCW"
words = { optional = ["I", "J", "R", "K"] }

# ---- group b: plane (power-up G17 on mills) ------------------------------

[[g]]
code = "G17"
group = 2
modal = true
handler = "plane_12"
description = "Plane of axes 1 and 2"

[[g]]
code = "G18"
group = 2
modal = true
handler = "plane_31"
description = "Plane of axes 3 and 1"

[[g]]
code = "G19"
group = 2
modal = true
handler = "plane_23"
description = "Plane of axes 2 and 3"

# ---- group c: dynamic mode (power-up G27). Feed and cornering only. ------

[[g]]
code = "G27"
group = 3
modal = true
handler = "no_effect"
description = "Continuous, with speed reduction on corners"

[[g]]
code = "G28"
group = 3
modal = true
handler = "no_effect"
description = "Continuous, without speed reduction on corners"

[[g]]
code = "G29"
group = 3
modal = true
handler = "no_effect"
description = "Point-to-point"

# ---- group d: axis presetting (power-up G99) -----------------------------

[[g]]
