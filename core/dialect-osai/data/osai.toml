group = 4
modal = false
handler = "ignored"
description = "Axis presetting without mirror"

[[g]]
code = "G98"
group = 4
modal = false
handler = "ignored"
description = "Axis presetting with mirror"

[[g]]
code = "G99"
group = 4
modal = true
