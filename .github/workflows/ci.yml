name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runner image and action versions are pinned, like the Rust toolchains, so
# CI does not change underneath us (e.g. when ubuntu-latest moves to a new
# release). Bump them deliberately, in their own PR.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Decides which jobs a pull request needs, from the files it changes
  # (rules and their tests in tools/ci/). Pushes to main run everything. A
  # job skipped here shows as "skipped", which GitHub counts as passing.
  changes:
    name: changed areas
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      fuzz: ${{ steps.areas.outputs.fuzz }}
      ui: ${{ steps.areas.outputs.ui }}
      app: ${{ steps.areas.outputs.app }}
      flatpak: ${{ steps.areas.outputs.flatpak }}
      audit: ${{ steps.areas.outputs.audit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the rules
        run: tools/ci/test-changed-areas.sh
      - name: Decide
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three dots: what the PR changed since it branched off, not what
          # main changed meanwhile.
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "Changed files:"; echo "$files"
            echo "$files" | tools/ci/changed-areas.sh | tee -a "$GITHUB_OUTPUT"
          else
            # Not a pull request, or the diff failed: run everything.
            printf '%s\n' rust=true fuzz=true ui=true app=true flatpak=true audit=true | tee -a "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: fmt, clippy, dependency rules, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned version
      # (with rustfmt and clippy) on first use.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Fails if any crate depends on something ARCHITECTURE.md section 5
      # forbids (rules in tools/depcheck/rules.toml).
      - name: Dependency rules
        run: cargo run -p depcheck
      - name: Test
        run: cargo test --workspace

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: desktop app shell (Tauri)
    runs-on: ubuntu-24.04
    defaults:
      run:
        # Its own Cargo workspace (ARCHITECTURE.md section 5), so the job
        # above needs no WebKit.
        working-directory: app/shell
    steps:
      - uses: actions/checkout@v7
      # The package mirrors once hung here for over 30 minutes (normally
      # about 20 s): fail fast instead, and re-run.
      - name: Install WebKit and the other system libraries Tauri needs
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      # The shell embeds the built UI (ui/dist) at compile time, so build it
      # first.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/shell -> target
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The tests use Tauri's mock runtime: no display needed.
      - name: Test
        run: cargo test

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    name: UI (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install (exact versions from the lock file)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # Includes the cross-boundary test: the TypeScript decoder reads the
      # same render_buffer_v2.bin fixture as the Rust test. The generated
      # constants are checked against core/ir by `cargo test` in the job
      # above.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  flatpak:
    needs: changes
    if: needs.changes.outputs.flatpak == 'true'
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the Flatpak tools
        run: |
          sudo apt-get update
          # elfutils: flatpak-builder strips debug info with eu-strip.
          # librsvg2-common: the SVG loader appstreamcli compose needs to
          # render the app's SVG icon.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common
          # Ubuntu 24.04 blocks unprivileged user namespaces, which the
          # Flatpak build sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Builds the UI, vendors the crates, builds offline in the GNOME SDK
      # and bundles (packaging/flatpak/README.md).
      - name: Build the bundle
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: packaging/flatpak/build.sh
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: gcode-editsim-flatpak
          path: gcode-editsim.flatpak
          if-no-files-found: error
          retention-days: 30

  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    name: fuzz parser (60 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned so CI does not break when nightly or cargo-fuzz change; bump
      # both deliberately.
      FUZZ_TOOLCHAIN: nightly-2026-10-29
      CARGO_FUZZ_VERSION: 0.13.2
      # Lints are enforced by the main job; a nightly lint must not fail
      # the fuzz build.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/gcode-syntax/fuzz -> target
          key: fuzz
      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Seed corpus from the golden programs
        working-directory: core/gcode-syntax
        run: |
          mkdir -p fuzz/corpus/parser
          cp ../../tests/golden/*.nc fuzz/corpus/parser/
      # Any panic, stack overflow, hang (>10 s for one input) or memory blow-up
      # (>2 GB) fails the job. The crashing input is uploaded below; reproduce
      # locally with `cargo +nightly fuzz run parser <file>` in core/gcode-syntax.
      - name: Fuzz the parser
        working-directory: core/gcode-syntax
        run: >
          cargo +"$FUZZ_TOOLCHAIN" fuzz run parser --
          -max_total_time=60 -max_len=4096 -timeout=10 -rss_limit_mb=2048
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash
          path: core/gcode-syntax/fuzz/artifacts/
          if-no-files-found: ignore

  # Known vulnerabilities in the dependencies (RustSec advisory database
  # and the npm registry). Runs on every push to main and on pull requests
  # that change a lock file. Advisories marked unmaintained or unsound are
  # reported as warnings; a vulnerability fails the job.
  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Not pinned, unlike the other tools: the advisory database it reads
      # changes format over time (0.21.2 could not read CVSS 4.0 scores),
      # so an old cargo-audit stops working. The latest release keeps up.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the core workspace
        run: cargo audit
      - name: Audit the app shell
        run: cargo audit --file app/shell/Cargo.lock
      - name: Audit the fuzz target
        run: cargo audit --file core/gcode-syntax/fuzz/Cargo.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit the UI packages
        working-directory: ui
        run: npm audit --audit-level=high
