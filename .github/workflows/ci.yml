name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runner image and action versions are pinned, like the Rust toolchains, so
# CI does not change underneath us (e.g. when ubuntu-latest moves to a new
# release). Bump them deliberately, in their own PR.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, dependency rules, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned version
      # (with rustfmt and clippy) on first use.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Fails if any crate depends on something ARCHITECTURE.md section 5
      # forbids (rules in tools/depcheck/rules.toml).
      - name: Dependency rules
        run: cargo run -p depcheck
      - name: Test
        run: cargo test --workspace

  app:
    name: desktop app shell (Tauri)
    runs-on: ubuntu-24.04
    defaults:
      run:
        # Its own Cargo workspace (ARCHITECTURE.md section 5), so the job
        # above needs no WebKit.
        working-directory: app/shell
    steps:
      - uses: actions/checkout@v7
      - name: Install WebKit and the other system libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      # The shell embeds the built UI (ui/dist) at compile time, so build it
      # first.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/shell -> target
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The tests use Tauri's mock runtime: no display needed.
      - name: Test
        run: cargo test

  ui:
    name: UI (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install (exact versions from the lock file)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # Includes the cross-boundary test: the TypeScript decoder reads the
      # same render_buffer_v1.bin fixture as the Rust test. The generated
      # constants are checked against core/ir by `cargo test` in the job
      # above.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install the Flatpak tools
        run: |
          sudo apt-get update
          # elfutils: flatpak-builder strips debug info with eu-strip.
          # librsvg2-common: the SVG loader appstreamcli compose needs to
          # render the app's SVG icon.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common
          # Ubuntu 24.04 blocks unprivileged user namespaces, which the
          # Flatpak build sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Builds the UI, vendors the crates, builds offline in the GNOME SDK
      # and bundles (packaging/flatpak/README.md).
      - name: Build the bundle
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: packaging/flatpak/build.sh
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: gcode-editsim-flatpak
          path: gcode-editsim.flatpak
          if-no-files-found: error
          retention-days: 30

  fuzz:
    name: fuzz parser (60 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned so CI does not break when nightly or cargo-fuzz change; bump
      # both deliberately.
      FUZZ_TOOLCHAIN: nightly-2026-10-29
      CARGO_FUZZ_VERSION: 0.13.2
      # Lints are enforced by the main job; a nightly lint must not fail
      # the fuzz build.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/gcode-syntax/fuzz -> target
          key: fuzz
      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Seed corpus from the golden programs
        working-directory: core/gcode-syntax
        run: |
          mkdir -p fuzz/corpus/parser
          cp ../../tests/golden/*.nc fuzz/corpus/parser/
      # Any panic, stack overflow, hang (>10 s for one input) or memory blow-up
      # (>2 GB) fails the job. The crashing input is uploaded below; reproduce
      # locally with `cargo +nightly fuzz run parser <file>` in core/gcode-syntax.
      - name: Fuzz the parser
        working-directory: core/gcode-syntax
        run: >
          cargo +"$FUZZ_TOOLCHAIN" fuzz run parser --
          -max_total_time=60 -max_len=4096 -timeout=10 -rss_limit_mb=2048
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash
          path: core/gcode-syntax/fuzz/artifacts/
          if-no-files-found: ignore
