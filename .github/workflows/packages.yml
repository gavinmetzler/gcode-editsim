name: Packages

# Builds the installable packages (M5.7). Called by the release workflow
# (with the Flatpak) and by CI when the packaging changes (without it: CI
# builds the Flatpak itself). Can also be run by hand from the Actions tab
# to try packages without publishing them.

on:
  workflow_call:
    inputs:
      flatpak:
        description: Also build the Flatpak bundle
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      flatpak:
        description: Also build the Flatpak bundle
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tauri's command-line tool, which builds the packages: pinned like the
  # other tools (CI changes only when we bump it), matching the tauri
  # crate's minor version in app/shell/Cargo.toml. Run from npm, where it
  # is prebuilt for every system (`cargo install tauri-cli` builds the same
  # tool from source in about 10 minutes); it is not a project dependency.
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  linux:
    name: Linux packages (.deb, .rpm)
    # The oldest supported Ubuntu with WebKitGTK 4.1: a package links
    # against the system C library it was built on, so building on 22.04
    # lets it install on 22.04 and newer (and distributions of that age)
    # rather than only on 24.04 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The package mirrors once hung for over 30 minutes: fail fast.
      - name: Install WebKit, the libraries Tauri needs, and rpm and cpio (to check the .rpm)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev \
            rpm cpio
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/shell -> target
          key: packages
      # The UI is built above. package-name.conf.json names the packages
      # gcode-editsim (Tauri would make g-code-edit-sim from the product
      # name); the app's settings folder goes by its identifier, unchanged.
      - name: Build the packages
        working-directory: app/shell
        run: npx --yes "$TAURI_CLI" build --bundles deb,rpm --config ../../packaging/linux/package-name.conf.json
      # Fixed names, so the README's "latest" download links always work.
      - name: Name the packages
        run: |
          mkdir -p dist
          cp app/shell/target/release/bundle/deb/*.deb dist/gcode-editsim-amd64.deb
          cp app/shell/target/release/bundle/rpm/*.rpm dist/gcode-editsim-x86_64.rpm
          ls -l dist
      - name: Check the packages
        run: packaging/linux/check-packages.sh dist/gcode-editsim-amd64.deb dist/gcode-editsim-x86_64.rpm
      # Installs the .deb as a user would, and the app's file type with it.
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./dist/gcode-editsim-amd64.deb
          test -x /usr/bin/gcode-editsim
          # dpkg's trigger rebuilt the shared file-type database with it.
          grep -qx 'text/x-cnc-gcode' /usr/share/mime/types
      - uses: actions/upload-artifact@v7
        with:
          name: gcode-editsim-linux
          path: dist/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/shell -> target
          key: packages
      # tauri.windows.conf.json: an NSIS installer for the current user (no
      # administrator needed), registering .nc, .ngc and .tap files. It
      # installs Microsoft's WebView2 if Windows lacks it (Windows 10 and
      # 11 normally have it).
      - name: Build the installer
        working-directory: app/shell
        run: npx --yes "$TAURI_CLI" build --bundles nsis
      - name: Name the installer
        run: |
          mkdir -p dist
          cp app/shell/target/release/bundle/nsis/*-setup.exe dist/gcode-editsim-windows-x64-setup.exe
          ls -l dist
      # Installs it silently as a user would, then starts the app and
      # checks it is still running a few seconds later.
      - name: Install and start
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath dist\gcode-editsim-windows-x64-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "the installer failed: $($setup.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'GCode EditSim'
          Get-ChildItem $dir
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw "no app in $dir" }
          if (-not (Test-Path 'Registry::HKEY_CURRENT_USER\Software\Classes\.nc')) { throw '.nc files are not registered' }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "the app exited at start with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v7
        with:
          name: gcode-editsim-windows
          path: dist/
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      # One app for both Apple silicon and Intel Macs.
      - name: Install pinned toolchain, for both processors
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/shell -> target
          key: packages
      # tauri.macos.conf.json: macOS 11 and newer, signed ad hoc (no Apple
      # developer account), so macOS asks before opening it the first time
      # (README, "Installing").
      - name: Build the app and disk image
        working-directory: app/shell
        run: npx --yes "$TAURI_CLI" build --bundles app,dmg --target universal-apple-darwin
      - name: Name the disk image
        run: |
          mkdir -p dist
          cp app/shell/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/gcode-editsim-macos.dmg
          ls -l dist
      # Checks the app runs on both processors and is signed, then starts it
      # and checks it is still running a few seconds later.
      - name: Check and start
        run: |
          app=$(ls -d app/shell/target/universal-apple-darwin/release/bundle/macos/*.app)
          exe="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          lipo -archs "$exe" | tee /dev/stderr | grep -q arm64
          lipo -archs "$exe" | grep -q x86_64
          codesign --verify --verbose "$app"
          hdiutil verify dist/gcode-editsim-macos.dmg
          "$exe" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "the app exited at start"; exit 1; }
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: gcode-editsim-macos
          path: dist/
          if-no-files-found: error
          retention-days: 30

  flatpak:
    if: inputs.flatpak
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The same steps as the CI job of this name (ci.yml).
      - name: Install the Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Build the bundle
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: gcode-editsim-flatpak-release
          path: gcode-editsim.flatpak
          if-no-files-found: error
          retention-days: 30
