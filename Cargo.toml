[workspace]
resolver = "2"
# Core library crates (see ARCHITECTURE.md §5), plus development tools.
# `app/backend` holds the app's behaviour; the Tauri shell (`app/shell`) is
# its own workspace so that building and testing the rest needs no WebKit.
members = [
    "core/gcode-syntax",
    "core/ir",
    "core/dialect-api",
    "core/dialect-fanuc",
    "core/dialect-osai",
    "core/machine-api",
    "core/machine-mill",
    "core/machine-lathe",
    "core/interpreter",
    "core/transform",
    "core/sim",
    "core/testkit",
    "tools/depcheck",
    "tools/gen-ts",
    "tools/corpus",
    "tools/bench",
    "app/backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "AGPL-3.0-only"

# Applied to every member via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
