[package]
name = "gcode-editsim"
description = "GCode EditSim desktop app: a thin Tauri shell over app-backend."
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

# Its own workspace: building Tauri needs WebKit (and later the mobile
# toolchains), which the core workspace and its CI must not need.
[workspace]

[lib]
name = "gcode_editsim"
crate-type = ["rlib"]

[features]
# Release builds serve the embedded UI through Tauri's custom protocol. The
# Tauri CLI turns this on for production builds; the Flatpak build passes it
# explicitly (`cargo build --release --features custom-protocol`).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
app-backend = { path = "../backend" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

# Already in the build through Tauri (GTK); used directly only to name the
# window after the app (`set_window_app_id`).
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18.5"

[dev-dependencies]
serde_json = "1.0.140"
tauri = { version = "2.12.5", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
