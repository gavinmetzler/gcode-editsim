<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- GCode EditSim app icon (M4.10, design B "code beside path", chosen by
     the owner 2026-11-02): an editor page with the selected line in yellow,
     beside a backplot of a feed move (blue) and an arc (green) with the
     selected arc in yellow. The app's own toolpath colours. Drawn on a
     128-unit grid with heavy strokes so it reads at 16 px.
     The PNGs in app/shell/icons are rendered from this file
     (see packaging/flatpak/README.md).
     The comment is inside the element: image loaders recognise an SVG by
     finding <svg in its first 256 bytes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a313d"/>
      <stop offset="1" stop-color="#161a20"/>
    </linearGradient>
  </defs>
  <!-- The tile, its left part the editor page. -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#tile)"/>
  <rect x="6" y="6" width="50" height="116" rx="26" fill="#e9edf2"/>
  <rect x="30" y="6" width="26" height="116" fill="#e9edf2"/>
  <!-- Program lines, the selected one yellow. -->
  <path d="M18 34 H44 M18 74 H46 M18 94 H34" stroke="#2a313d" stroke-width="9" stroke-linecap="round"/>
  <path d="M18 54 H38" stroke="#ffd23f" stroke-width="9" stroke-linecap="round"/>
  <!-- The backplot: feed moves (blue), the selected arc (yellow). -->
  <path d="M70 100 V58" stroke="#4099ff" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M110 58 V76" stroke="#4099ff" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M70 58 A20 20 0 0 1 110 58" stroke="#ffd23f" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
